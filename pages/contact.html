<!DOCTYPE html>
<html lang="en">
<head>
  <title>Contact - Roman Kriuchkov</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles/styles.css" />
  <base href="/my-portfolio">
</head>
<body>
  <div id="header"></div>

  <main>
    <section id="contact" class="contact">
      <div class="container">
        <h2 class="section-title">Get In Touch</h2>
        <div class="contact-content">
          <div class="contact-info">
            <h3>Let’s connect</h3>
            <p>
              I’m open to collaborations, aprenticeships, and backend development opportunities.  
              If you’d like to discuss a project or just network, feel free to reach out!
            </p>
            <div class="contact-methods">
              <div class="contact-method">
                <span class="contact-icon">📧</span>
                <span>roman.kriuchkov7@gmail.com</span>
              </div>
              <div class="contact-method">
                <span class="contact-icon">📍</span>
                <span>Belfast, United Kingdom</span>
              </div>
            </div>
            <div class="social-links">
              <a href="https://github.com/RoMmMaNnN" class="social-link">GitHub</a>
              <a href="https://linkedin.com/in/roman-kriuchkov-259972367" class="social-link">LinkedIn</a>
            </div>
          </div>

          <form class="contact-form" id="contact-form">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" required />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/components.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/observer.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script src="/js/email-init.js" defer></script>
  <script src="/js/contact.js" defer></script>

</body>
</html>
